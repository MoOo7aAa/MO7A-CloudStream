name: Build CloudStream plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: builds
          path: builds
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        working-directory: src
        run: gradle make makePluginsJson

      - name: Publish plugin files
        shell: bash
        run: |
          set -e
          find src -type f -name '*.cs3' -exec cp {} builds/ \;
          cp src/build/plugins.json builds/plugins.json
          cd builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build plugins from ${{ github.sha }}" || echo "No changes to publish"
          git push
